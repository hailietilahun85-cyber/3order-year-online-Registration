<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3rd Year Computer Science Registration</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --error: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    header {
      border-bottom: 2px solid var(--bg);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.1rem;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }

    input[type="text"] {
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .radio-group {
      display: flex;
      gap: 1.5rem;
      padding: 0.4rem 0;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      cursor: pointer;
      margin: 0;
    }

    .error-msg {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 0.3rem;
      display: none;
    }

    .btn-submit {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    #slipSection {
      display: none;
      margin-top: 1.75rem;
      padding: 1.25rem;
      border: 2px dashed var(--success);
      border-radius: 10px;
      background: #f0fdf4;
    }

    #slipSection h3 {
      color: var(--success);
      margin-bottom: 0.6rem;
    }

    #slipDetails p {
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>3rd Year Computer Science Registration</h1>
      <p>Online Student Registration Form</p>
    </header>

    <form id="regForm" novalidate>
      <div class="form-group">
        <label for="firstName">First Name *</label>
        <input type="text" id="firstName" placeholder="e.g., Abebe" required />
        <span class="error-msg" id="firstNameError">First name is required.</span>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name *</label>
        <input type="text" id="lastName" placeholder="e.g., Kebede" required />
        <span class="error-msg" id="lastNameError">Last name is required.</span>
      </div>

      <div class="form-group">
        <label for="studentId">Student ID *</label>
        <input type="text" id="studentId"  required />
        <span class="error-msg" id="idError">Student ID is required.</span>
      </div>

      <div class="form-group">
        <label>Sex *</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="sex" value="Male" required />
            Male
          </label>
          <label>
            <input type="radio" name="sex" value="Female" required />
            Female
          </label>
        </div>
        <span class="error-msg" id="sexError">Please select sex.</span>
      </div>

      <button type="submit" class="btn-submit">Submit Registration</button>
    </form>

    <div id="slipSection">
      <h3>Registration Submitted</h3>
      <div id="slipDetails"></div>
    </div>
  </div>

  <script>
    const regForm = document.getElementById('regForm');
    const slipSection = document.getElementById('slipSection');
    const slipDetails = document.getElementById('slipDetails');

    regForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const studentId = document.getElementById('studentId').value.trim();
      const sexInput = document.querySelector('input[name="sex"]:checked');

      let isValid = true;

      if (!firstName) {
        document.getElementById('firstNameError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('firstNameError').style.display = 'none';
      }

      if (!lastName) {
        document.getElementById('lastNameError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('lastNameError').style.display = 'none';
      }

      if (!studentId) {
        document.getElementById('idError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('idError').style.display = 'none';
      }

      if (!sexInput) {
        document.getElementById('sexError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('sexError').style.display = 'none';
      }

      if (!isValid) return;

      slipDetails.innerHTML = `
        <p><strong>First Name:</strong> ${firstName}</p>
        <p><strong>Last Name:</strong> ${lastName}</p>
        <p><strong>Student ID:</strong> ${studentId}</p>
        <p><strong>Sex:</strong> ${sexInput.value}</p>
      `;

      slipSection.style.display = 'block';
    });
  </script>

</body>
</html>
